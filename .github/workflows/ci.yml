name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 静态检查与操作系统无关，只在 Linux 跑一次，避免三倍 CI 时间。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: golangci/golangci-lint-action@v7
        with:
          # .golangci.yml 是 v2 格式，必须锁 v2.x 二进制。
          version: v2.13.2
          args: --timeout=5m

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # go.mod 要求 go >= 1.25.0：更低版本的工具链根本编译不了本模块
        # （GOTOOLCHAIN=local 下直接报错），所以矩阵只跟 go.mod 对齐。
        go: ["1.25.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Format
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
        shell: bash
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
        if: runner.os != 'windows'
      # -fuzz 不能与多包同时使用（每个测试二进制只允许一个 fuzz 目标），
      # 所以每个 fuzz 目标一步。Windows 跳过：语料目录与 mmap 路径差异大。
      - name: Fuzz smoke (store open)
        run: go test . -run '^$' -fuzz '^Fuzz' -fuzztime=5s
        if: runner.os != 'windows'
      - name: Fuzz smoke (row index page parser)
        run: go test ./internal/index -run '^$' -fuzz '^Fuzz' -fuzztime=5s
        if: runner.os != 'windows'
