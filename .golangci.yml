version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  # 不强制检查未处理的错误返回值：本仓库大量 Close/Remove/Fprint 属于
  # 清理路径或 CLI 诊断输出，逐个 _ = 只会制造噪音，真正需要传播的错误
  # 由测试与 vet 保证。
  disable:
    - errcheck

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      # 与 Makefile 的 `gofmt -w .` 保持一致：不启用 -s 简化，
      # 否则 make fmt 与 make lint 会互相反复改写同一处代码。
      simplify: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
